<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="400" viewBox="0 0 1160 400" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1160" height="400" rx="16" fill="#F6F7FA"/>
  <defs>
    <marker id="vm-arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M1,1 L9,6 L1,11" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Priority indicator -->
  <line x1="40" y1="70" x2="40" y2="330" stroke="#85889c" stroke-width="2" marker-end="url(#vm-arrow)"/>
  <text x="30" y="205" font-size="15" fill="#85889c" font-weight="600" text-anchor="middle" transform="rotate(-90 30 205)">priority increases — later sources win</text>

  <!-- Input 1: chart values.yaml (defaults) -->
  <rect x="80" y="60" width="360" height="72" rx="12" fill="#ffffff" stroke="#E7E8EF" stroke-width="2"/>
  <circle cx="118" cy="96" r="15" fill="#EEF3FE"/>
  <text x="118" y="102" font-size="18" fill="#2563EB" font-weight="700" text-anchor="middle">1</text>
  <text x="150" y="90" font-size="21" fill="#14161f" font-weight="700">chart values.yaml</text>
  <text x="150" y="115" font-size="16" fill="#4b4e63">the defaults</text>

  <!-- Input 2: -f values-prod.yaml -->
  <rect x="80" y="164" width="360" height="72" rx="12" fill="#ffffff" stroke="#E7E8EF" stroke-width="2"/>
  <circle cx="118" cy="200" r="15" fill="#EEF3FE"/>
  <text x="118" y="206" font-size="18" fill="#2563EB" font-weight="700" text-anchor="middle">2</text>
  <text x="150" y="194" font-size="21" fill="#14161f" font-weight="700">-f values-prod.yaml</text>
  <text x="150" y="219" font-size="16" fill="#4b4e63">per-environment overlay</text>

  <!-- Input 3: set flag -->
  <rect x="80" y="268" width="360" height="72" rx="12" fill="#ffffff" stroke="#E7E8EF" stroke-width="2"/>
  <circle cx="118" cy="304" r="15" fill="#EEF3FE"/>
  <text x="118" y="310" font-size="18" fill="#2563EB" font-weight="700" text-anchor="middle">3</text>
  <text x="150" y="298" font-size="21" fill="#14161f" font-weight="700">--set key=value</text>
  <text x="150" y="323" font-size="16" fill="#4b4e63">highest priority (wins)</text>

  <!-- Merge (hexagon) -->
  <polygon points="600,150 690,150 730,200 690,250 600,250 560,200" fill="#2563EB"/>
  <text x="645" y="207" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">merge</text>

  <!-- Final values -->
  <rect x="820" y="158" width="300" height="84" rx="12" fill="#EEF3FE" stroke="#2563EB" stroke-width="2"/>
  <text x="970" y="195" font-size="23" fill="#1E40AF" font-weight="700" text-anchor="middle">final values</text>
  <text x="970" y="221" font-size="16" fill="#4b4e63" text-anchor="middle">used to render the chart</text>

  <!-- Arrows into merge -->
  <path d="M440,96 Q520,96 560,180" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#vm-arrow)"/>
  <line x1="440" y1="200" x2="552" y2="200" stroke="#2563EB" stroke-width="2.5" marker-end="url(#vm-arrow)"/>
  <path d="M440,304 Q520,304 560,220" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#vm-arrow)"/>

  <!-- Arrow to final -->
  <line x1="730" y1="200" x2="812" y2="200" stroke="#2563EB" stroke-width="2.5" marker-end="url(#vm-arrow)"/>
</svg>
