<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="470" rx="16" fill="#F6F7FA"/>
  <defs>
    <marker id="wf-arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M1,1 L9,6 L1,11" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Chart -->
  <rect x="40" y="95" width="230" height="95" rx="12" fill="#ffffff" stroke="#E7E8EF" stroke-width="2"/>
  <text x="155" y="135" font-size="24" fill="#14161f" font-weight="700" text-anchor="middle">Chart</text>
  <text x="155" y="163" font-size="17" fill="#4b4e63" text-anchor="middle">from a repository</text>

  <!-- values.yaml -->
  <rect x="40" y="270" width="230" height="95" rx="12" fill="#ffffff" stroke="#E7E8EF" stroke-width="2"/>
  <text x="155" y="310" font-size="24" fill="#14161f" font-weight="700" text-anchor="middle">values.yaml</text>
  <text x="155" y="338" font-size="17" fill="#4b4e63" text-anchor="middle">your configuration</text>

  <!-- helm (hexagon) -->
  <polygon points="410,170 500,170 540,230 500,290 410,290 370,230" fill="#2563EB"/>
  <text x="455" y="238" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">helm</text>

  <!-- manifests -->
  <rect x="650" y="170" width="250" height="120" rx="12" fill="#ffffff" stroke="#E7E8EF" stroke-width="2"/>
  <text x="775" y="222" font-size="23" fill="#14161f" font-weight="700" text-anchor="middle">Kubernetes</text>
  <text x="775" y="252" font-size="23" fill="#14161f" font-weight="700" text-anchor="middle">manifests</text>

  <!-- cluster (cylinder) -->
  <g>
    <path d="M980,185 a90,18 0 0 1 180,0 v90 a90,18 0 0 1 -180,0 z" fill="#EEF3FE" stroke="#2563EB" stroke-width="2"/>
    <ellipse cx="1070" cy="185" rx="90" ry="18" fill="#ffffff" stroke="#2563EB" stroke-width="2"/>
    <text x="1070" y="248" font-size="24" fill="#1E40AF" font-weight="700" text-anchor="middle">Cluster</text>
  </g>

  <!-- release history -->
  <rect x="370" y="360" width="270" height="85" rx="12" fill="#ffffff" stroke="#E7E8EF" stroke-width="2"/>
  <text x="505" y="396" font-size="21" fill="#14161f" font-weight="700" text-anchor="middle">Release +</text>
  <text x="505" y="422" font-size="21" fill="#14161f" font-weight="700" text-anchor="middle">revision history</text>

  <!-- Arrows -->
  <path d="M270,140 L340,140 Q370,140 380,175" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <path d="M270,317 L340,317 Q370,317 380,285" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <text x="315" y="120" font-size="16" fill="#4b4e63" font-weight="600" text-anchor="middle">install</text>

  <line x1="540" y1="230" x2="642" y2="230" stroke="#2563EB" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <text x="591" y="216" font-size="16" fill="#4b4e63" font-weight="600" text-anchor="middle">renders</text>

  <line x1="900" y1="230" x2="972" y2="230" stroke="#2563EB" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <text x="936" y="216" font-size="16" fill="#4b4e63" font-weight="600" text-anchor="middle">applies</text>

  <line x1="455" y1="290" x2="455" y2="352" stroke="#2563EB" stroke-width="2.5" marker-end="url(#wf-arrow)"/>
  <text x="512" y="328" font-size="16" fill="#4b4e63" font-weight="600" text-anchor="middle">records</text>
</svg>
