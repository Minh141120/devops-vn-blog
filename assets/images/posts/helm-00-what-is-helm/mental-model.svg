<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1E293B" flood-opacity="0.10"/>
    </filter>
    <marker id="mm-arrow" markerWidth="12" markerHeight="12" refX="7" refY="6" orient="auto">
      <path d="M1,1 L9,6 L1,11" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1180" height="360" rx="18" fill="#F6F7FA"/>

  <!-- ===== Card 1: Repository ===== -->
  <rect x="40" y="90" width="300" height="196" rx="16" fill="#ffffff" stroke="#E7E8EF" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="68" y="118" width="56" height="56" rx="14" fill="#EEF3FE"/>
  <g stroke="#2563EB" stroke-width="2.4" fill="none" stroke-linecap="round">
    <ellipse cx="96" cy="137" rx="13" ry="5"/>
    <path d="M83,137 V155 a13,5 0 0 0 26,0 V137"/>
    <path d="M83,146 a13,5 0 0 0 26,0"/>
  </g>
  <text x="140" y="157" font-size="30" fill="#14161f" font-weight="700">Repository</text>
  <text x="70" y="216" font-size="20" fill="#2563EB" font-weight="700">chart storage</text>
  <text x="70" y="245" font-size="17" fill="#4b4e63">where charts are stored</text>
  <text x="70" y="269" font-size="17" fill="#4b4e63">and shared (HTTP / OCI)</text>

  <!-- ===== Card 2: Chart ===== -->
  <rect x="440" y="90" width="300" height="196" rx="16" fill="#ffffff" stroke="#E7E8EF" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="468" y="118" width="56" height="56" rx="14" fill="#EEF3FE"/>
  <g stroke="#2563EB" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M496,131 l12,6 v13 l-12,6 l-12,-6 v-13 Z"/>
    <path d="M484,137 l12,6 l12,-6"/>
    <path d="M496,143 v13"/>
  </g>
  <text x="540" y="157" font-size="30" fill="#14161f" font-weight="700">Chart</text>
  <text x="470" y="216" font-size="20" fill="#2563EB" font-weight="700">the package</text>
  <text x="470" y="245" font-size="17" fill="#4b4e63">templated Kubernetes</text>
  <text x="470" y="269" font-size="17" fill="#4b4e63">manifests + metadata</text>

  <!-- ===== Card 3: Release ===== -->
  <rect x="840" y="90" width="300" height="196" rx="16" fill="#ffffff" stroke="#E7E8EF" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="868" y="118" width="56" height="56" rx="14" fill="#EEF3FE"/>
  <g stroke="#2563EB" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M896,127 c8,6 8,16 4,24 h-8 c-4,-8 -4,-18 4,-24 Z"/>
    <circle cx="896" cy="140" r="3.2" fill="#2563EB" stroke="none"/>
    <path d="M892,150 l-6,6 l4,0"/>
    <path d="M900,150 l6,6 l-4,0"/>
    <path d="M893,153 l3,6 l3,-6" stroke="#3B82F6"/>
  </g>
  <text x="940" y="157" font-size="30" fill="#14161f" font-weight="700">Release</text>
  <text x="870" y="216" font-size="20" fill="#2563EB" font-weight="700">deployed instance</text>
  <text x="870" y="245" font-size="17" fill="#4b4e63">one install of a chart</text>
  <text x="870" y="269" font-size="17" fill="#4b4e63">running in the cluster</text>

  <!-- ===== Connectors ===== -->
  <line x1="348" y1="188" x2="432" y2="188" stroke="#2563EB" stroke-width="2.5" marker-end="url(#mm-arrow)"/>
  <rect x="338" y="173" width="104" height="30" rx="15" fill="#ffffff" stroke="#E7E8EF" stroke-width="1.5"/>
  <text x="390" y="193" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">helm pull</text>

  <line x1="748" y1="188" x2="832" y2="188" stroke="#2563EB" stroke-width="2.5" marker-end="url(#mm-arrow)"/>
  <rect x="738" y="173" width="104" height="30" rx="15" fill="#ffffff" stroke="#E7E8EF" stroke-width="1.5"/>
  <text x="790" y="193" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">helm install</text>
</svg>
