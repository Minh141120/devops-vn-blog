{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-webapp
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  rules:
    {{- with .Values.ingress }}
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-webapp
                port:
                  number: 80
    {{- end }}
{{- end }}
