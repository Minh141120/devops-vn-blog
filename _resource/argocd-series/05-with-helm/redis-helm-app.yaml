# Chapter 5 — deploy Redis directly from the CloudPirates OCI Helm chart with an Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-helm-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/cloudpirates
    chart: redis
    targetRevision: 0.33.0
    helm:
      releaseName: redis
      parameters:
        - name: architecture
          value: replication
        - name: replicaCount
          value: "3"
        - name: sentinel.enabled
          value: "true"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
