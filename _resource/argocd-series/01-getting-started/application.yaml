# Chapter 1 — Getting Started
#
# The declarative equivalent of the "+ New App" UI steps: a single Application
# that deploys the whole Book Info microservice app from a public Git repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookinfo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/VersusControl/devops-vn-blog'
    targetRevision: HEAD
    path: '_resource/argocd-series/01-getting-started/bookinfo'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
